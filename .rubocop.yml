AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  Exclude:
    - 'vendor/**/*'

Gemspec/RequireMFA:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  AllowedMethods: ['describe', 'context']

Naming/FileName:
  # Bundler's default require resolves the gem name verbatim
  Exclude:
    - 'lib/queue-datadog-monitor.rb'
