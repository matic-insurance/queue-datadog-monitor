
version: 2.1

orbs:
  ruby: circleci/ruby@1.8.0

jobs:

  rspec-test:
    resource_class: small
    parameters:
      ruby-version:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>
    steps:
      - checkout
      - ruby/install-deps
      - run:
          name: Run RSpec Tests
          command: bundle exec rspec

  rubocop:
    resource_class: small
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - ruby/install-deps
      - run:
          name: Run Rubocop
          command: bundle exec rubocop --parallel

workflows:

  queue-datadog-monitor.build-pull-request:
    when:
      not:
        equal: [ main, << pipeline.git.branch >> ]
    jobs:

      - rspec-test:
          name: rspec
          matrix:
            parameters:
              ruby-version: [ '3.4' ]

      - rubocop:
          name: rubocop

  queue-datadog-monitor.build-main:
    when:
      equal: [ main, << pipeline.git.branch >> ]
    jobs:

      - rspec-test:
          name: rspec
          matrix:
            parameters:
              ruby-version: [ '3.4' ]

      - rubocop:
          name: rubocop
